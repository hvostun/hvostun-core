[dependency-groups]
dev = [
    "prek>=0.4.14,<1.0.0",
    "typer>=0.27.1,<1.0.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
extraPaths = ["backend"]


[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "frontend/src/client/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.typos.default.extend-words]
# Имя таблицы в схеме: session_recomendations.recomendation_id
recomendation = "recomendation"
recomendations = "recomendations"
