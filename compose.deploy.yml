services:
  proxy:
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - traefik-certificates:/certificates
    # Do not add --api or --api.insecure. The local dashboard is compose.override.yml.
    command:
      - --providers.docker
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.network=hvostun_public
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entrypoint.to=https
      - --entrypoints.http.http.redirections.entrypoint.scheme=https
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL:?Variable not set}
      - --certificatesresolvers.le.acme.storage=/certificates/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --accesslog
      - --log

  db:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: hvostun_production

  db-roles:
    environment:
      POSTGRES_DB: hvostun_production

  # Adminer is a local-only tool. Even if explicitly started in this
  # deployment composition, Traefik must not publish it.
  db-ui:
    image: adminer:6.0.1
    profiles: ["dev"]
    restart: "no"
    labels:
      - traefik.enable=false

  prestart:
    image: backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FASTAPI_ENV: production
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://hvostun_migrator:${POSTGRES_MIGRATOR_PASSWORD:?Variable not set}@db:5432/hvostun_production
    command: ["bash", "scripts/prestart.sh"]

  backend:
    restart: unless-stopped
    depends_on:
      prestart:
        condition: service_completed_successfully
    environment:
      FASTAPI_ENV: production
      DATABASE_URL: postgresql://hvostun_app:${POSTGRES_APP_PASSWORD:?Variable not set}@db:5432/hvostun_production
    labels:
      - traefik.http.routers.backend-https.rule=Host(`${DOMAIN:?Variable not set}`)
      - traefik.http.routers.backend-https.entrypoints=https
      - traefik.http.routers.backend-https.tls=true
      - traefik.http.routers.backend-https.tls.certresolver=le
      - traefik.http.routers.backend-https.middlewares=secure-headers
      - traefik.http.routers.backend-login.rule=Host(`${DOMAIN:?Variable not set}`) && Path(`/login`) && Method(`POST`)
      - traefik.http.routers.backend-login.entrypoints=https
      - traefik.http.routers.backend-login.tls=true
      - traefik.http.routers.backend-login.tls.certresolver=le
      - traefik.http.routers.backend-login.priority=100
      - traefik.http.routers.backend-login.service=backend
      - traefik.http.routers.backend-login.middlewares=login-ratelimit,secure-headers
      - traefik.http.middlewares.login-ratelimit.ratelimit.average=5
      - traefik.http.middlewares.login-ratelimit.ratelimit.period=1m
      - traefik.http.middlewares.login-ratelimit.ratelimit.burst=10
      - traefik.http.middlewares.login-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth=0
      # Dynamic bar widths in session_detail.html need style-src-attr.
      - traefik.http.middlewares.secure-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.secure-headers.headers.stsIncludeSubdomains=true
      - traefik.http.middlewares.secure-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.secure-headers.headers.frameDeny=true
      - traefik.http.middlewares.secure-headers.headers.referrerPolicy=same-origin
      - traefik.http.middlewares.secure-headers.headers.contentSecurityPolicy=default-src 'self'; style-src 'self' https://cdn.jsdelivr.net; style-src-attr 'unsafe-inline'; frame-ancestors 'none'; form-action 'self'

volumes:
  traefik-certificates:
