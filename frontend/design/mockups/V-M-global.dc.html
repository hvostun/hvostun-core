/* верхнее меню десктопа */
header.tb{background:#ffffff;border-bottom:1px solid rgba(27,36,64,.08);color:#1b2440}
.tn a{height:36px;align-self:center;padding:0 16px;border-bottom:0;border-radius:999px;color:#59617f;font-weight:500}
.tn a.on{background:#cfe8f8;color:#3352a3;font-weight:600}
.tn a.off{color:#a9adbf}

/* типографика */
.h1{font-family:Oswald,Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1;font-size:30px;color:#1b2440}
h1.q,.kh{font-family:Oswald,Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:1}
.h2{font-weight:600}
.q{font-weight:600}
.tx{color:#1b2440}
.cp,.hn,.se,.mt,.cn,.dl dt,.me span{color:#59617f}
p.bn{font-family:Oswald,Impact,sans-serif;font-weight:700;color:#3352a3}

/* кнопки */
.b1,.b2,.b0{min-height:52px;border:0;border-radius:14px;font-size:16px;font-weight:600}
.b1{background:#3352a3;color:#fbf6ec;box-shadow:0 1px 2px rgba(36,52,110,.22),0 6px 14px -8px rgba(36,52,110,.5)}
.b1:hover{color:#fbf6ec}
.b2{background:#ffffff;color:#3352a3;box-shadow:inset 0 0 0 1px rgba(27,36,64,.16)}
.b0{background:rgba(27,36,64,.08);color:#6f7590;box-shadow:none}
.sm{min-height:44px;font-size:15px}
.lk,button.tb,a.tb{color:#3352a3}
.tl{font-size:14px;color:#59617f;text-decoration-color:rgba(89,97,127,.4);text-underline-offset:3px}

/* поля */
.fl>label,legend{font-size:14px;font-weight:600;color:#1b2440}
.in{height:52px;padding:0 16px;border:0;border-radius:12px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.14);color:#1b2440;font-size:16px}
.in:disabled{background:#f8f6f0;box-shadow:none;color:#6f7590}
.in.er,.ta.er{box-shadow:inset 0 0 0 1.5px #1b2440}
.fo{outline:2px solid #8cc8ee;outline-offset:2px}
.ch input,.op input{accent-color:#3352a3}
.ib,.cal{color:#59617f}
.et{color:#1b2440}
.sub{border-left:2px solid #8cc8ee}

/* иллюстрации */
.im{background:transparent;border:0;overflow:hidden}
.im img{display:block;max-width:100%;max-height:100%;mix-blend-mode:multiply;filter:grayscale(1) contrast(1.35) brightness(1.08)}

/* метки */
.ut{border:0;border-radius:999px;padding:2px 8px;background:#cfe8f8;color:#24397a;font-weight:600}
.st{border:0;background:#e4f1fa;color:#24397a}

/* подсказки, ошибки, окна */
.pl{border:0;border-radius:12px;background:#e4f1fa;color:#1b2440}
.pl svg{color:#24397a}
.pop{border:0;border-radius:16px;background:#e4f1fa}
.sc,.cm{background:rgba(27,36,64,.38)}
.sh{border:0;border-radius:24px 24px 0 0;padding:24px 20px 28px;background:#ffffff}
.md{border:0;border-radius:20px;background:#ffffff;box-shadow:0 24px 48px -24px rgba(27,36,64,.45)}

/* чипы и выбор */
.cx{min-height:40px;border:0;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.16);color:#1b2440;font-size:15px;font-weight:500}
.cx.on{background:#3352a3;box-shadow:none;color:#fbf6ec;font-weight:600}
.cx.dis{background:transparent;box-shadow:inset 0 0 0 1px rgba(27,36,64,.1);color:#a9adbf}
.cx.on.dis{background:#9ba0b6;color:#fbf6ec}
.sg{border:0;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(27,36,64,.16)}
.sg button{background:transparent}
.sg button+button{border-left:1px solid rgba(27,36,64,.12)}
.sg .on{background:#3352a3;color:#fbf6ec}
.op{min-height:52px;padding:0 14px;border:0;border-radius:12px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.14)}
.op.on{background:#ffffff;box-shadow:inset 0 0 0 1.5px #3352a3;font-weight:600}

/* списки профиля */
.sec{border-bottom:1px solid rgba(27,36,64,.09)}
.li{border-bottom:1px solid rgba(27,36,64,.09);color:#1b2440}

/* анкета */
.pg{height:6px;border-radius:3px;background:rgba(27,36,64,.1)}
.pg i{border-radius:3px;background:#3352a3}
.qc{border:0;border-radius:20px;background:#ffffff;box-shadow:0 0 0 1px rgba(27,36,64,.06),0 1px 2px rgba(27,36,64,.05),0 6px 14px -8px rgba(27,36,64,.16)}
.ft{border-top:1px solid rgba(27,36,64,.08)}
.s11 button,.sl button{border:0;border-radius:8px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.14);font-weight:500;color:#1b2440}
.s11 .on,.sl .on{background:#3352a3;box-shadow:none;color:#fbf6ec;font-weight:600}
.qe{border:0;border-radius:12px;box-shadow:inset 0 0 0 1.5px #1b2440}

/* чат */
.sb{border-bottom:1px solid rgba(27,36,64,.08)}
.bm{border:0;border-radius:12px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.14);color:#59617f}
.sf{border:0;background:#cfe8f8;color:#48506e}
.sf svg{color:#24397a}
.ai{border-radius:999px;padding:0 8px;background:#cfe8f8;color:#24397a;font-weight:600}
.mu{background:#3352a3;color:#fbf6ec;border-radius:16px 16px 6px 16px}
.mu.fl,.mu.fl2{background:#ffffff;color:#1b2440;border:1.5px dashed rgba(27,36,64,.3)}
.ma{border:0;border-radius:16px 16px 16px 6px;background:#ffffff;box-shadow:0 0 0 1px rgba(27,36,64,.06),0 1px 2px rgba(27,36,64,.05),0 6px 14px -8px rgba(27,36,64,.16)}
.ma.ur{border:0;background:#e4f1fa;box-shadow:inset 0 0 0 2px #24397a}
.src{border-top:1px solid rgba(27,36,64,.1)}
.fb{border:0;border-radius:16px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.12)}
.fb textarea{border:0;border-radius:12px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.16)}
.ip{border-top:0}
.ta{border:0;border-radius:16px;background:#ffffff;box-shadow:inset 0 0 0 1px rgba(27,36,64,.16)}
.sn{border-radius:12px;background:#3352a3;color:#fbf6ec}
.sn:disabled{background:#e3f4a2;color:#59617f}
.dt i{background:#3352a3!important}
.dt i:nth-child(2){opacity:.6}
.dt i:nth-child(3){opacity:.3}

/* каталог */
.kh{font-size:40px}
.sh2{border-bottom:2px solid #3352a3;font-weight:600}
.en{border-bottom:1px solid rgba(27,36,64,.09)}

/* ===== Н один в один ===== */
.dg{display:block;pointer-events:none;mix-blend-mode:normal!important;filter:none!important}
.im{display:flex;align-items:center;justify-content:center}

.art{flex:1 1 0;min-height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.art .dg{max-width:100%;max-height:100%;width:auto;height:auto}

/* вход */
.hero{margin:0;font-family:Oswald,Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:.95;font-size:46px;color:#fbf6ec}

.g .tx{color:#fbf6ec}
.g .fl{gap:8px}
.lgl{width:440px;height:600px;display:flex;flex-direction:column;gap:20px}
.lgl .tg{text-align:left}

/* главная */
.hn{flex:none;margin:10px 0 10px}
.hn .nm{margin:0;font-family:Oswald,Impact,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.01em;font-size:40px;line-height:.95;color:#3352a3}
.dk .hn .nm{font-size:52px}
.hn .dd{margin:10px 0 0;font-size:15px;line-height:1.3;color:#59617f}
a.nx{flex:none;flex-direction:row;align-items:center;gap:16px;padding:18px 16px 18px 20px;color:#fbf6ec;text-decoration:none}

.nx .tx{flex:1;min-width:0;color:inherit}
.nx .k{display:block;margin:0 0 4px}
.nx .t{display:block;font-size:20px;font-weight:700;line-height:1.2}
.nx .ar{flex:none;width:44px;height:44px;border-radius:999px;background:#ffffff;color:#3352a3;display:flex;align-items:center;justify-content:center}
.cd,.wg{flex-direction:row;align-items:center;gap:14px;min-height:76px;padding:14px 40px 14px 14px}
.ti{flex:none;width:44px;height:44px;border-radius:12px;background:#e4f1fa;color:#3352a3;display:flex;align-items:center;justify-content:center}

.wg>a{flex:1;min-width:0}
.cd .h2,.wg .h2{font-size:17px;font-weight:600;line-height:1.3}
.cd .d,.wg .d{font-size:14px;line-height:1.4}
.cd.off .ti,.wg.off .ti{background:rgba(27,36,64,.05);color:#59617f}
.ph .hdog{position:absolute;right:22px;bottom:84px;width:96px;z-index:0}

.tl{position:relative;z-index:1}

.ft{border-top:0}

.shdog{width:120px;align-self:center;margin-bottom:4px}

.ac [aria-pressed="true"]{background:#cfe8f8;color:#24397a}
.cdog{align-self:center;width:170px;margin:0 0 12px}
.ir{display:flex;gap:8px;align-items:flex-end}
.ir .ta{flex:1}

/* окна и листы: заголовок интерфейсным шрифтом */
.sh .h1,.md .h1{font-family:Onest,system-ui,sans-serif;text-transform:none;letter-spacing:0;font-weight:600;font-size:20px!important;line-height:1.3}

/* профиль: группы полей, как в Н */
form.mn>.fl:first-child{padding-bottom:20px;border-bottom:1px solid rgba(27,36,64,.09)}
form.mn>.fl:has(.cal):not(:first-child),form.mn>fieldset:nth-of-type(n+3):last-of-type{padding-top:20px;border-top:1px solid rgba(27,36,64,.09)}
.sc{z-index:5}
.ph form.mn:not(:has(.pl))>.b1.w:last-child{position:absolute;z-index:3;left:20px;right:20px;width:auto;bottom:90px;box-shadow:0 1px 2px rgba(36,52,110,.22),0 6px 14px -8px rgba(36,52,110,.5),0 -18px 22px 10px #ffffff}
.dk .sec{border:0;border-radius:16px;background:#ffffff;box-shadow:0 0 0 1px rgba(27,36,64,.06),0 1px 2px rgba(27,36,64,.05),0 6px 14px -8px rgba(27,36,64,.16)}

/* каталог: фокус */
[style*="outline: 2px solid #000"]{outline-color:#8cc8ee!important}

/* ===== дизайн-система 2 ===== */
.g .hero{color:#a9d8f5}
.g .b1{background:#e3f4a2;color:#24397a}
.g .tx,.g .fl>label,.g .ch{color:#fbf6ec}
.nv a.on::before{background-color:#e3f4a2}
.nv a.on{color:#24397a}
.nx .k{color:#a9d8f5}
.nx .ar{background:#e3f4a2;color:#24397a}
.ti-user{background:#e3f4a2;color:#24397a}
.ti-chat{background:#cfe8f8;color:#24397a}
.ti-plan{background:#dedaf7;color:#24397a}
.hn .nm{color:#8cc8ee}
.ph .ft{background:linear-gradient(to bottom,rgba(255,255,255,0),#ffffff 30px)}

/* шапка экрана по сетке: кнопки на тех же полях 16, что и контент */
.ph .hd{padding:0 16px}
.hd .cl,.hd .rb{margin:0}

/* дисклеймер чата: светло-голубой из ДС */
.sf{background:#e4f1fa}
